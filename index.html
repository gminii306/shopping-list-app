<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 24px; }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #667eea; }
    button.add-btn {
      padding: 10px 18px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.add-btn:hover { background: #5a67d8; }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    li:last-child { border-bottom: none; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }
    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      transition: all 0.2s;
    }
    .item-text.done {
      text-decoration: line-through;
      color: #a0aec0;
    }
    button.del-btn {
      background: none;
      border: none;
      color: #fc8181;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    button.del-btn:hover { background: #fff5f5; }
    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 24px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="상품 이름 입력..." />
      <button class="add-btn" onclick="addItem()">추가</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">리스트가 비어 있습니다.</p>
  </div>

  <script>
    const input = document.getElementById('itemInput');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    function updateEmpty() {
      empty.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addItem() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', () => {
        span.classList.toggle('done', cb.checked);
      });

      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = text;

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.addEventListener('click', () => {
        li.remove();
        updateEmpty();
      });

      li.append(cb, span, del);
      list.appendChild(li);
      input.value = '';
      updateEmpty();
    }

    updateEmpty();
  </script>
</body>
</html>
