<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 4px; }
    .subtitle {
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #68d391;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #667eea; }
    button.add-btn {
      padding: 10px 18px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.add-btn:hover { background: #5a67d8; }
    button.add-btn:disabled { background: #c3caf5; cursor: not-allowed; }
    ul { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    li:last-child { border-bottom: none; }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }
    .item-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      transition: all 0.2s;
    }
    .item-text.done {
      text-decoration: line-through;
      color: #a0aec0;
    }
    button.del-btn {
      background: none;
      border: none;
      color: #fc8181;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    button.del-btn:hover { background: #fff5f5; }
    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 24px 0;
      font-size: 0.95rem;
    }
    .error-msg {
      color: #fc8181;
      font-size: 0.85rem;
      text-align: center;
      padding: 8px 0;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>쇼핑 리스트</h1>
    <p class="subtitle"><span class="dot"></span>실시간 동기화 중</p>
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="상품 이름 입력..." />
      <button class="add-btn" id="addBtn">추가</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty">리스트가 비어 있습니다.</p>
    <p class="error-msg" id="errorMsg"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL = 'https://vygwalvildefvizoxgha.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5Z3dhbHZpbGRlZnZpem94Z2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MTcwMTgsImV4cCI6MjA5NDk5MzAxOH0.s5Ae6ENs9rT_adGQ17hTFkhtn9xk0_9MJCh7lvrdzfA'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const input   = document.getElementById('itemInput')
    const list    = document.getElementById('list')
    const empty   = document.getElementById('empty')
    const addBtn  = document.getElementById('addBtn')
    const errMsg  = document.getElementById('errorMsg')

    function showError(msg) {
      errMsg.textContent = msg
      errMsg.style.display = 'block'
      setTimeout(() => { errMsg.style.display = 'none' }, 3000)
    }

    function updateEmpty() {
      empty.style.display = list.children.length === 0 ? 'block' : 'none'
    }

    function renderItem(item) {
      if (list.querySelector(`li[data-id="${item.id}"]`)) return

      const li   = document.createElement('li')
      li.dataset.id = item.id

      const cb   = document.createElement('input')
      cb.type    = 'checkbox'
      cb.checked = item.completed
      cb.addEventListener('change', () => toggleItem(item.id, cb.checked))

      const span = document.createElement('span')
      span.className = 'item-text' + (item.completed ? ' done' : '')
      span.textContent = item.name

      const del  = document.createElement('button')
      del.className = 'del-btn'
      del.textContent = '✕'
      del.addEventListener('click', () => deleteItem(item.id))

      li.append(cb, span, del)
      list.appendChild(li)
      updateEmpty()
    }

    function updateItemUI(item) {
      const li = list.querySelector(`li[data-id="${item.id}"]`)
      if (!li) return
      const cb   = li.querySelector('input[type="checkbox"]')
      const span = li.querySelector('.item-text')
      cb.checked = item.completed
      span.className = 'item-text' + (item.completed ? ' done' : '')
    }

    function removeItemUI(id) {
      const li = list.querySelector(`li[data-id="${id}"]`)
      if (li) { li.remove(); updateEmpty() }
    }

    async function loadItems() {
      const { data, error } = await supabase
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: true })

      if (error) { showError('데이터 불러오기 실패'); return }
      list.innerHTML = ''
      data.forEach(renderItem)
      updateEmpty()
    }

    async function addItem() {
      const text = input.value.trim()
      if (!text) return

      addBtn.disabled = true
      const { error } = await supabase
        .from('shopping_items')
        .insert({ name: text })

      addBtn.disabled = false
      if (error) { showError('추가 실패: ' + error.message); return }
      input.value = ''
    }

    async function toggleItem(id, completed) {
      const { error } = await supabase
        .from('shopping_items')
        .update({ completed })
        .eq('id', id)

      if (error) showError('수정 실패: ' + error.message)
    }

    async function deleteItem(id) {
      const { error } = await supabase
        .from('shopping_items')
        .delete()
        .eq('id', id)

      if (error) showError('삭제 실패: ' + error.message)
    }

    supabase
      .channel('shopping_items_changes')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'shopping_items' },
        payload => { renderItem(payload.new); updateEmpty() })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'shopping_items' },
        payload => updateItemUI(payload.new))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'shopping_items' },
        payload => removeItemUI(payload.old.id))
      .subscribe()

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem() })
    addBtn.addEventListener('click', addItem)

    loadItems()
  </script>
</body>
</html>
